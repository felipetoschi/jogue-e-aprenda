<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Lexend:wght@400;600;700&display=swap"
    />
    <title>Cobrinha Sabida</title>
  </head>
  <body>
    <main class="jogo">
      <header class="hud">
        <div class="hud-linha">
          <span id="rotulo" class="rotulo"></span>
          <span id="pontos" class="pontos" aria-live="polite">0/20</span>
        </div>
        <div id="conta" class="conta" aria-live="polite">&nbsp;</div>
        <div id="alternativas" class="alternativas" aria-live="polite"></div>
        <div id="dica" class="dica" hidden>Mova a cobra para começar</div>
        <div class="energia" role="progressbar" aria-label="Energia" aria-valuemin="0" aria-valuemax="100">
          <div id="energia" class="energia-barra"></div>
        </div>
      </header>

      <div class="tabuleiro-area">
        <div class="tabuleiro-caixa">
        <canvas id="tabuleiro" class="tabuleiro" aria-label="Tabuleiro"></canvas>

        <section id="tela-preparo" class="sobreposicao">
          <h1>Cobrinha Sabida</h1>
          <p id="preparo-detalhe" class="detalhe"></p>
          <ul class="instrucoes">
            <li>Coma a letra da resposta certa.</li>
            <li>Errou, bateu na borda, no corpo ou ficou sem energia: fim de jogo.</li>
            <li class="so-teclado">Setas ou W A S D para virar, Espaço para pausar.</li>
            <li class="so-toque">Use as setas embaixo da tela ou deslize o dedo no tabuleiro.</li>
          </ul>
          <button id="botao-comecar" class="botao" type="button">Começar</button>
          <div id="contagem" class="contagem" hidden></div>
        </section>

        <section id="tela-pausa" class="sobreposicao" hidden>
          <h2>Pausado</h2>
          <button id="botao-continuar" class="botao" type="button">Continuar</button>
          <button id="botao-sair" class="botao secundario" type="button">Sair da partida</button>
        </section>

        <section id="tela-fim" class="sobreposicao" hidden>
          <h2 id="fim-titulo"></h2>
          <p id="fim-conta" class="conta-resolvida"></p>
          <p id="fim-explicacao" class="explicacao"></p>
          <p id="fim-pontos" class="detalhe"></p>
          <button id="botao-de-novo" class="botao" type="button" hidden>Jogar de novo</button>
          <button id="botao-ver-resultado" class="botao secundario" type="button" hidden>Ver resultado</button>
        </section>
        </div>
      </div>

      <div class="controles">
        <button id="botao-som" class="botao-redondo botao-som" type="button" aria-label="Desligar som">♪</button>
        <button id="botao-pausa" class="botao-redondo botao-pausa" type="button" aria-label="Pausar">II</button>
        <div id="setas" class="setas" role="group" aria-label="Direção">
          <button type="button" class="seta seta-cima" data-direcao="cima" aria-label="Cima">▲</button>
          <button type="button" class="seta seta-esquerda" data-direcao="esquerda" aria-label="Esquerda">◀</button>
          <button type="button" class="seta seta-direita" data-direcao="direita" aria-label="Direita">▶</button>
          <button type="button" class="seta seta-baixo" data-direcao="baixo" aria-label="Baixo">▼</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
